name: Build

# Baut Server + Desktop- und Handy-Clients. Release-Tags (v1.2.3) signieren und notarisieren
# die Mac-App zusätzlich (Secrets: docs/RELEASE.md). Optional in den Repo-Einstellungen unter
# Settings → Secrets and variables → Actions → Variables setzen:
#   TALKIE_SERVER       z. B. talkie.example.org:7777  (dann müssen die Kids nur Name + Code eingeben)
#   TALKIE_FINGERPRINT  Fingerabdruck aus "talkie-server status" (fest eingebautes Zertifikats-Pinning)

on:
  push:
    # feature/** und chore/**: nur Tests; devel, main, Tags und PRs: Tests + alle Builds
    branches: [main, devel, "feature/**", "chore/**", "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read

# Neuer Push auf denselben Branch bricht den älteren, noch laufenden Lauf ab
# (spart Build-Minuten). Releases (Tags) werden nie abgebrochen.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: "3.44.7"
  DART_DEFINES: >-
    --dart-define=TALKIE_SERVER=${{ vars.TALKIE_SERVER }}
    --dart-define=TALKIE_FINGERPRINT=${{ vars.TALKIE_FINGERPRINT }}

jobs:
  test:
    name: Tests (Server, Kern, Ende-zu-Ende)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake pkg-config
      - name: Server-Tests
        working-directory: server
        run: go test -race ./...
      - name: Kern-Tests
        working-directory: app/rust
        run: cargo test --lib
      - name: Ende-zu-Ende gegen echten Server
        run: |
          cd server && go build -o /tmp/talkie-server . && cd ..
          TALKIE_DATA=/tmp/talkie-data /tmp/talkie-server &
          sleep 2
          CODE=$(TALKIE_DATA=/tmp/talkie-data /tmp/talkie-server invite 5 1 | awk '/Einladungscode/{print $2}')
          cd app/rust && cargo run --example e2e -- 127.0.0.1:7777 "$CODE"

  macos:
    name: macOS (Universal, ab 10.15)
    if: ${{ !(github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/chore/') || startsWith(github.ref, 'refs/heads/fix/'))) }}
    needs: test
    # Xcode 27+ kann nicht mehr für macOS 10.15/11 bauen → ältere Runner-Version mit Xcode 16
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bauen
        working-directory: app
        run: flutter build macos --release $DART_DEFINES
      - name: DMG packen (ohne Signatur, Test-Builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: app
        run: |
          APP=build/macos/Build/Products/Release/Talkie.app
          lipo -info "$APP/Contents/MacOS/Talkie"
          tool/make_dmg.sh "$APP" Talkie-macOS.dmg
      # Release: mit Developer ID signieren und bei Apple notarisieren (Secrets siehe docs/RELEASE.md)
      - name: Signieren und notarisieren
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          if [ -z "$CERTIFICATE_P12" ] || [ -z "$NOTARY_KEY_P8" ] || [ -z "$NOTARY_KEY_ID" ]; then
            echo "::error::Secrets für die Notarisierung fehlen (siehe docs/RELEASE.md)"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8" tool/notarize_macos.sh build/macos/Build/Products/Release/Talkie.app Talkie-macOS.dmg
      - name: Schlüsselbund und Schlüssel entfernen
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@v5
        with:
          name: Talkie-macOS
          path: app/Talkie-macOS.dmg

  windows:
    name: Windows (ab 10)
    if: ${{ !(github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/chore/') || startsWith(github.ref, 'refs/heads/fix/'))) }}
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bauen
        working-directory: app
        shell: bash
        run: flutter build windows --release $DART_DEFINES
      - name: Paket mit Laufzeit-DLLs
        working-directory: app
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          # Visual-C++-Laufzeit beilegen, damit keine Extra-Installation nötig ist
          foreach ($dll in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "C:/Windows/System32/$dll" $out
          }
          Compress-Archive -Path "$out/*" -DestinationPath Talkie-Windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: Talkie-Windows
          path: app/Talkie-Windows.zip

  linux:
    name: Linux (x64)
    if: ${{ !(github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/chore/') || startsWith(github.ref, 'refs/heads/fix/'))) }}
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bauen
        working-directory: app
        run: flutter build linux --release $DART_DEFINES
      - name: Paket
        working-directory: app
        run: |
          mv build/linux/x64/release/bundle Talkie
          cp linux/packaging/install.sh Talkie/
          tar czf Talkie-Linux-x64.tar.gz Talkie
      - uses: actions/upload-artifact@v5
        with:
          name: Talkie-Linux
          path: app/Talkie-Linux-x64.tar.gz

  android:
    name: Android (ab 8.0)
    if: ${{ !(github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/chore/') || startsWith(github.ref, 'refs/heads/fix/'))) }}
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bauen
        working-directory: app
        # Signiert mit dem Debug-Schlüssel: zum direkten Installieren, nicht für den Play Store
        run: flutter build apk --release $DART_DEFINES
      - name: Paket
        working-directory: app
        run: cp build/app/outputs/flutter-apk/app-release.apk Talkie-Android.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Talkie-Android
          path: app/Talkie-Android.apk

  release:
    name: Release anlegen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Installieren
            - **Mac** (ab macOS 10.15, Intel und Apple Silicon): `Talkie-macOS.dmg` öffnen, Talkie in „Programme“ ziehen. Signiert und von Apple notarisiert.
            - **Windows** (ab 10): `Talkie-Windows.zip` entpacken, `talkie.exe` starten. Beim ersten Start „Weitere Informationen → Trotzdem ausführen“.
            - **Linux** (x64): `Talkie-Linux-x64.tar.gz` entpacken, im Ordner `./install.sh` ausführen.
            - **Android** (ab 8.0): `Talkie-Android.apk` öffnen und installieren.
            - **iPhone/iPad** (ab iOS 15): über TestFlight – https://testflight.apple.com/join/zfBAJJNK

            Zum Anmelden brauchst du einen Einladungscode vom Betreiber deines Talkie-Servers.
