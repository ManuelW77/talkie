[package]
license = "GPL-3.0-only"
name = "rust_lib_talkie"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
cpal = "0.18.2"
directories = "6.0.0"
ed25519-dalek = "3.0.0"
flutter_rust_bridge = "=2.13.0"
getrandom = "0.4.3"
hex = "0.4.3"
log = "0.4.35"
nnnoiseless = "0.5.2"
opus = "0.4.0"
parking_lot = "0.13.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

# Push-to-Talk: systemweite Tastenabfrage
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
x11-dl = "2.21"

# Android: cpal braucht den Java-Kontext der App (siehe src/android.rs)
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3"
ndk-context = "0.1"

# Debug-Builds: keine Debug-Infos für Abhängigkeiten (sonst 200 MB große Android-APK)
[profile.dev.package."*"]
debug = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
