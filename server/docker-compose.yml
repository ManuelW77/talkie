services:
  talkie:
    build: .
    image: talkie-server:latest
    container_name: talkie
    restart: unless-stopped
    ports:
      - "7777:7777/udp"
      # Verwaltungsseite: nur lokal freigeben, von außen über einen Reverse-Proxy mit HTTPS
      - "127.0.0.1:8080:8080"
    volumes:
      - talkie-data:/data
    environment:
      TALKIE_MAX_USERS: "50"
      # Chatnachrichten nach so vielen Stunden löschen (0 = nie)
      TALKIE_CHAT_HOURS: ${TALKIE_CHAT_HOURS:-24}
      # Hinweis auf neue App-Versionen: der Server fragt täglich bei GitHub nach (leer = aus)
      TALKIE_UPDATE_REPO: ${TALKIE_UPDATE_REPO-ManuelW77/talkie}
      # oder fest vorgeben (z. B. 1.2.0), dann ohne GitHub
      TALKIE_LATEST_VERSION: ${TALKIE_LATEST_VERSION:-}
      TZ: Europe/Berlin
      # --- Verwaltungsseite (aus, solange TALKIE_PUBLIC_URL leer ist) ---
      TALKIE_PUBLIC_URL: ${TALKIE_PUBLIC_URL:-}
      TALKIE_TRUST_PROXY: ${TALKIE_TRUST_PROXY:-1}
      TALKIE_ADMIN_EMAIL: ${TALKIE_ADMIN_EMAIL:-}
      TALKIE_SERVER_ADDR: ${TALKIE_SERVER_ADDR:-}
      TALKIE_DOWNLOAD_URL: ${TALKIE_DOWNLOAD_URL:-}
      # Login per Mail
      TALKIE_SMTP_HOST: ${TALKIE_SMTP_HOST:-}
      TALKIE_SMTP_PORT: ${TALKIE_SMTP_PORT:-587}
      TALKIE_SMTP_USER: ${TALKIE_SMTP_USER:-}
      TALKIE_SMTP_PASS: ${TALKIE_SMTP_PASS:-}
      TALKIE_SMTP_FROM: ${TALKIE_SMTP_FROM:-}
      TALKIE_SMTP_TLS: ${TALKIE_SMTP_TLS:-}
      # Login per OIDC (Pocket ID, Authentik, Keycloak, Google, …)
      TALKIE_OIDC_ISSUER: ${TALKIE_OIDC_ISSUER:-}
      TALKIE_OIDC_CLIENT_ID: ${TALKIE_OIDC_CLIENT_ID:-}
      TALKIE_OIDC_CLIENT_SECRET: ${TALKIE_OIDC_CLIENT_SECRET:-}
      TALKIE_OIDC_NAME: ${TALKIE_OIDC_NAME:-}
      TALKIE_OIDC_ALLOW_UNVERIFIED: ${TALKIE_OIDC_ALLOW_UNVERIFIED:-}

volumes:
  talkie-data:
