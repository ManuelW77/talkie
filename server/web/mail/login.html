<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Talkie</title></head>
<body style="margin:0;padding:0;background:#f6f3ee;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f3ee;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#22201c;">
<tr><td align="center" style="padding:28px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #ebe5dc;">
  <tr><td style="padding:26px 24px 0;text-align:center;">
    <img src="cid:talkie-icon" width="56" height="56" alt="Talkie" style="display:block;margin:0 auto 12px;border-radius:13px;">
    <div style="font-size:20px;font-weight:800;">Hallo {{.Name}},</div>
    <div style="font-size:15px;color:#5d574e;margin-top:4px;">hier ist dein Code für die Talkie-Verwaltung.</div>
  </td></tr>
  <tr><td style="padding:20px 24px 4px;text-align:center;">
    <div style="display:inline-block;padding:14px 22px;background:#fff6ec;border:2px solid #F58A2B;border-radius:12px;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:6px;color:#22201c;">{{.Code}}</div>
  </td></tr>
  <tr><td style="padding:18px 24px 6px;text-align:center;">
    <a href="{{.Link}}" style="display:inline-block;padding:12px 26px;background:#F58A2B;color:#ffffff;text-decoration:none;border-radius:10px;font-weight:700;font-size:15px;">Direkt anmelden</a>
  </td></tr>
  <tr><td style="padding:12px 24px 26px;text-align:center;font-size:13px;line-height:1.5;color:#8a8275;">
    Code und Link gelten 15 Minuten und nur einmal.<br>Wenn du das nicht angefordert hast, ignoriere diese Mail einfach.
  </td></tr>
</table>
</td></tr></table>
</body></html>
